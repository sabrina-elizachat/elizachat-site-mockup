  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>

 0; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"border: 1px solid #1e1e24; padding: 12px; background: #ffffff; box-shadow: 0 40px 80px -48px rgba(30,30,36,0.4)\">\n<img src=\"b4f2240f-5a0d-4a31-a5e8-11dfecd901ca\" alt=\"Illustration of a vintage computer terminal showing an ELIZA conversation. A person says they are depressed and unhappy, and ELIZA answers with questions such as 'What would it mean to you if you got some help'.\" style=\"display: block; width: 100%; height: auto\">\n<\u002Fdiv>\n<figcaption style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; text-align: left; font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 0.04em; color: #3a3a42\"><span>FIG. 01 — ELIZA running its DOCTOR script.<\u002Fspan><span>Capitals are ELIZA. The rest is the person.<\u002Fspan><\u002Ffigcaption>\n<\u002Ffigure>\n<div class=\"ec-float ec-par-down\" style=\"position: absolute; left: 0; top: 16%; max-width: 260px; padding: 16px 20px; border-radius: 20px 20px 20px 6px; background: #ffffff; border: 1px solid rgba(30,30,36,0.14); box-shadow: 0 24px 48px -28px rgba(5,66,91,0.4); text-align: left\">\n<p style=\"margin: 0 0 6px; font-family: 'Courier Prime', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #05425b\">2026<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.45; color: #1e1e24\">What's been on your mind lately?<\u002Fp>\n<\u002Fdiv>\n<div class=\"ec-float ec-par-up\" style=\"position: absolute; right: 0; bottom: -24px; width: 260px; padding: 10px; border-radius: 20px; background: #ffffff; border: 1px solid rgba(30,30,36,0.14); box-shadow: 0 30px 60px -32px rgba(30,30,36,0.45); text-align: left; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"height: 200px; border-radius: 14px; background: #efebe2; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; font-family: 'Courier Prime', monospace; font-size: 13px; line-height: 1.5; color: #1e1e24\">[PHOTO]<br>Woman mindfully using her phone<\u002Fdiv>\n<p style=\"margin: 0 6px 6px; font-size: 14px; line-height: 1.5; color: #3a3a42\">Same human need. Sixty years of lessons on how to meet it well.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"story\" aria-labelledby=\"story-h\" style=\"position: relative\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 128px 24px 64px; display: flex; flex-direction: column; gap: 56px\">\n\n<div style=\"display: flex; flex-direction: column; gap: 24px\">\n<div style=\"display: flex; align-items: center; gap: 16px; font-family: 'Courier Prime', monospace; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #1e1e24\"><span aria-hidden=\"true\" style=\"width: 8px; height: 8px; background: #23a5bf\"><\u002Fspan><span>01 — Origins<\u002Fspan><span aria-hidden=\"true\" style=\"flex: 1; height: 1px; background: rgba(30,30,36,0.24)\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px 64px; align-items: flex-end; justify-content: space-between\">\n<h2 id=\"story-h\" style=\"margin: 0; flex: 1 1 480px; font-size: clamp(36px, 4.4vw, 56px); line-height: 1.08; font-weight: 500; letter-spacing: -1px; color: #000000\">The Eliza story<\u002Fh2>\n<p style=\"margin: 0; flex: 0 1 460px; font-size: 18px; line-height: 1.7; color: #3a3a42\">Long before smartphones, one professor taught a room-sized computer to hold a conversation. What he learned about people still shapes how we build today.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div ref=\"{{termRef}}\" style=\"background: #1e1e24; color: #fdfbf7; padding: 32px 36px 36px; display: flex; flex-direction: column; gap: 16px\">\n<p aria-hidden=\"true\" style=\"margin: 0; font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 0.14em; color: #d9d4c7\">RUN ELIZA.HISTORY<\u002Fp>\n<p style=\"margin: 0; font-family: 'Courier Prime', monospace; font-size: clamp(22px, 2.5vw, 30px); line-height: 1.5; color: #fdfbf7\"><span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">{{fullText}}<\u002Fspan><span aria-hidden=\"true\">{{typedText}}<\u002Fspan><span aria-hidden=\"true\" class=\"ec-cursor\" style=\"display: inline-block; width: 0.55em; height: 1.05em; margin-left: 4px; vertical-align: -0.15em; background: #f3e3b5\"><\u002Fspan><\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start\">\n<div class=\"ec-sticky\" style=\"flex: 1 1 420px; min-width: 0; position: sticky; top: 96px; border: 1px solid #1e1e24; background: #ffffff; display: flex; flex-direction: column\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid #1e1e24; font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #1e1e24\"><span>Archive<\u002Fspan><span>{{activeNum}}<\u002Fspan><\u002Fdiv>\n<p aria-hidden=\"true\" style=\"margin: 0; padding: 18px 18px 8px; font-family: 'Courier Prime', monospace; font-size: clamp(56px, 6.4vw, 96px); line-height: 1; font-weight: 700; letter-spacing: -2px; color: #1e1e24\">{{activeYear}}<\u002Fp>\n<div style=\"position: relative; margin: 10px 18px 0; aspect-ratio: 4 / 3; border: 1px solid #1e1e24; background: #efebe2; overflow: hidden\">\n<sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"1\">\n<div class=\"ec-vis\" data-on=\"{{s.on}}\" aria-hidden=\"{{s.hidden}}\">\n<sc-if value=\"{{s.isImage}}\" hint-placeholder-val=\"{{false}}\"><img src=\"{{s.src}}\" alt=\"{{s.alt}}\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%\"><\u002Fsc-if>\n<sc-if value=\"{{s.isPlaceholder}}\" hint-placeholder-val=\"{{true}}\"><div style=\"width: 100%; height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-family: 'Courier Prime', monospace; font-size: 14px; line-height: 1.6; color: #1e1e24; white-space: pre-line\">{{s.label}}<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{s.isTerminal}}\" hint-placeholder-val=\"{{false}}\"><div style=\"width: 100%; height: 100%; box-sizing: border-box; background: #1e1e24; color: #fdfbf7; padding: 24px; font-family: 'Courier Prime', monospace; font-size: 15px; line-height: 1.8; white-space: pre-line\">{{s.label}}<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{s.isLogo}}\" hint-placeholder-val=\"{{false}}\"><div style=\"width: 100%; height: 100%; background: #ffffff; display: flex; align-items: center; justify-content: center\"><img src=\"699c5601-3115-436a-b289-a62d7d75c315\" alt=\"ElizaChat logo\" style=\"width: 40%; height: auto\"><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin: 0; padding: 12px 18px 4px; font-family: 'Courier Prime', monospace; font-size: 13px; line-height: 1.5; letter-spacing: 0.02em; color: #3a3a42; min-height: 40px\">{{activeCaption}}<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; padding: 0 8px 8px\">\n<sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"8\">\n<button type=\"button\" aria-label=\"Jump to {{s.year}}: {{s.title}}\" sc-camel-on-click=\"{{s.go}}\" style=\"width: 44px; height: 44px; padding: 0; background: transparent; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer\"><span class=\"ec-dot\" data-on=\"{{s.dotOn}}\"><\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<ol style=\"flex: 1 1 460px; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column\">\n<sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"8\">\n<li ref=\"{{s.ref}}\" data-state=\"{{s.state}}\" class=\"ec-step\" style=\"min-height: 380px; box-sizing: border-box; padding: 24px 0 24px 32px; display: flex; flex-direction: column; justify-content: center; gap: 14px\">\n<p style=\"margin: 0; font-family: 'Courier Prime', monospace; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #05425b\">{{s.year}}<\u002Fp>\n<h3 style=\"margin: 0; font-size: clamp(24px, 2.3vw, 30px); line-height: 1.2; font-weight: 500; color: #000000\">{{s.title}}<\u002Fh3>\n<p style=\"margin: 0; max-width: 520px; font-size: 18px; line-height: 1.7; color: #3a3a42\">{{s.body}}<\u002Fp>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"effect-h\" style=\"position: relative\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 64px 24px 160px; display: flex; flex-direction: column; gap: 56px\">\n<div style=\"display: flex; flex-direction: column; gap: 24px\">\n<div style=\"display: flex; align-items: center; gap: 16px; font-family: 'Courier Prime', monospace; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #1e1e24\"><span aria-hidden=\"true\" style=\"width: 8px; height: 8px; background: #23a5bf\"><\u002Fspan><span>02 — The lesson<\u002Fspan><span aria-hidden=\"true\" style=\"flex: 1; height: 1px; background: rgba(30,30,36,0.24)\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px 64px; align-items: flex-end; justify-content: space-between\">\n<h2 id=\"effect-h\" style=\"margin: 0; flex: 1 1 480px; font-size: clamp(36px, 4.4vw, 56px); line-height: 1.08; font-weight: 500; letter-spacing: -1px; color: #000000\">The ELIZA effect<\u002Fh2>\n<p style=\"margin: 0; flex: 0 1 460px; font-size: 18px; line-height: 1.7; color: #3a3a42\">Our tendency to believe a computer understands us, or cares, because it answers in human-sounding words. ELIZA understood nothing. People confided in it anyway.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 56px; align-items: stretch\">\n<div class=\"ec-reveal\" style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n<p style=\"margin: 0; font-family: 'Courier Prime', monospace; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #05425b\">How ELIZA worked<\u002Fp>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column\">\n<li style=\"display: flex; gap: 20px; padding: 20px 0; border-top: 1px solid rgba(30,30,36,0.14)\"><span style=\"flex: 0 0 auto; font-family: 'Courier Prime', monospace; font-size: 14px; color: #05425b; padding-top: 3px\">01<\u002Fspan><div style=\"display: flex; flex-direction: column; gap: 4px\"><p style=\"margin: 0; font-size: 20px; font-weight: 500; color: #000000\">Scan<\u002Fp><p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #3a3a42\">Look for a keyword in your sentence, like \"I AM\" or \"MOTHER\".<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display: flex; gap: 20px; padding: 20px 0; border-top: 1px solid rgba(30,30,36,0.14)\"><span style=\"flex: 0 0 auto; font-family: 'Courier Prime', monospace; font-size: 14px; color: #05425b; padding-top: 3px\">02<\u002Fspan><div style=\"display: flex; flex-direction: column; gap: 4px\"><p style=\"margin: 0; font-size: 20px; font-weight: 500; color: #000000\">Flip<\u002Fp><p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #3a3a42\">Swap the pronouns, so \"my\" becomes \"your\".<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display: flex; gap: 20px; padding: 20px 0; border-top: 1px solid rgba(30,30,36,0.14); border-bottom: 1px solid rgba(30,30,36,0.14)\"><span style=\"flex: 0 0 auto; font-family: 'Courier Prime', monospace; font-size: 14px; color: #05425b; padding-top: 3px\">03<\u002Fspan><div style=\"display: flex; flex-direction: column; gap: 4px\"><p style=\"margin: 0; font-size: 20px; font-weight: 500; color: #000000\">Reassemble<\u002Fp><p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #3a3a42\">Pour your words into a stock question. No keyword? \"PLEASE GO ON.\"<\u002Fp><\u002Fdiv><\u002Fli>\n<\u002Fol>\n<p style=\"margin: 0; font-family: 'Courier Prime', monospace; font-size: 13px; line-height: 1.6; color: #3a3a42\">Try it. A simplified teaching recreation, not Weizenbaum's original program.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"ec-reveal\" style=\"flex: 1 1 500px; min-width: 0; background: #1e1e24; color: #fdfbf7; display: flex; flex-direction: column; font-family: 'Courier Prime', monospace\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 6px 20px; border-bottom: 1px solid #4a4a52; font-size: 13px; letter-spacing: 0.14em; color: #d9d4c7\"><span>ELIZA · DOCTOR SCRIPT<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{reset}}\" style=\"min-height: 44px; padding: 0 14px; background: transparent; border: none; color: #fdfbf7; font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 0.14em; text-decoration: underline; cursor: pointer\">RESET<\u002Fbutton><\u002Fdiv>\n<div role=\"log\" aria-live=\"polite\" aria-label=\"Conversation with ELIZA\" style=\"flex: 1; min-height: 300px; max-height: 360px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; font-size: 16px; line-height: 1.55\">\n<sc-for list=\"{{msgs}}\" as=\"m\" hint-placeholder-count=\"2\">\n<sc-if value=\"{{m.isEliza}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><p style=\"margin: 0; color: #fdfbf7\">{{m.text}}<\u002Fp><p style=\"margin: 0; font-size: 12px; color: #c9c5bb\">↳ {{m.trace}}<\u002Fp><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{m.isUser}}\" hint-placeholder-val=\"{{false}}\">\n<p style=\"margin: 0; color: #f3e3b5\">&gt; {{m.text}}<\u002Fp>\n<\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 14px\">\n<sc-for list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"3\">\n<button type=\"button\" sc-camel-on-click=\"{{c.send}}\" style=\"min-height: 44px; padding: 0 14px; background: transparent; border: 1px solid #6a675f; color: #fdfbf7; font-family: 'Courier Prime', monospace; font-size: 14px; cursor: pointer\">{{c.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 10px; padding: 14px 20px 20px; border-top: 1px solid #4a4a52\">\n<label for=\"eliza-input\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Type a message to ELIZA<\u002Flabel>\n<input id=\"eliza-input\" type=\"text\" autocomplete=\"off\" placeholder=\"Type how you feel…\" value=\"{{draft}}\" sc-camel-on-change=\"{{onDraft}}\" sc-camel-on-key-down=\"{{onKey}}\" style=\"flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; background: #2b2b33; border: 1px solid #6a675f; color: #fdfbf7; font-family: 'Courier Prime', monospace; font-size: 16px\">\n<button type=\"button\" sc-camel-on-click=\"{{sendDraft}}\" style=\"min-height: 48px; padding: 0 20px; background: #f3e3b5; border: none; color: #1e1e24; font-family: 'Courier Prime', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer\">SEND<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<p style=\"margin: 0; padding-top: 24px; border-top: 1px solid rgba(30,30,36,0.14); font-family: 'Courier Prime', monospace; font-size: 12px; line-height: 1.7; color: #3a3a42\">SOURCES — J. Weizenbaum, \"ELIZA — A Computer Program for the Study of Natural Language Communication Between Man and Machine,\" Communications of the ACM 9(1), 1966 · J. Weizenbaum, Computer Power and Human Reason, 1976 · R. Lane et al., \"ELIZA Reanimated,\" arXiv:2501.06707, 2025.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n\n<section id=\"mission\" aria-labelledby=\"mission-h\" style=\"background: #fdfbf7\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px 160px; display: flex; flex-direction: column; gap: 80px\">\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px 32px; padding: 56px 24px; border-top: 1px solid rgba(30,30,36,0.14); border-bottom: 1px solid rgba(30,30,36,0.14)\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; align-items: flex-start\">\n<p style=\"margin: 0; font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 0.14em; color: #3a3a42\">1966<\u002Fp>\n<p style=\"margin: 0; padding: 16px 20px; border: 1px solid #1e1e24; background: #ffffff; font-family: 'Courier Prime', monospace; font-size: 17px; letter-spacing: 0.08em; color: #1e1e24\">TELL ME MORE ABOUT YOUR FAMILY<\u002Fp>\n<\u002Fdiv>\n<svg aria-hidden=\"true\" width=\"48\" height=\"20\" sc-camel-view-box=\"0 0 56 24\" fill=\"none\" stroke=\"#05425b\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12h50M42 3l10 9-10 9\"><\u002Fpath><\u002Fsvg>\n<div style=\"display: flex; flex-direction: column; gap: 10px; align-items: flex-start\">\n<p style=\"margin: 0; font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 0.14em; color: #05425b\">2026<\u002Fp>\n<p class=\"ec-morph\" style=\"margin: 0; padding: 16px 22px; border-radius: 20px; border: 1px solid rgba(35,165,191,0.9); background: #ffffff; font-size: 17px; color: #1e1e24\">What's been on your mind with your family lately?<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin: 0; flex: 1 1 100%; text-align: center; font-size: 17px; line-height: 1.6; color: #3a3a42\">The words got warmer. The responsibility stayed the same.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 24px\">\n<div style=\"display: flex; align-items: center; gap: 16px; font-family: 'Courier Prime', monospace; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #1e1e24\"><span aria-hidden=\"true\" style=\"width: 8px; height: 8px; background: #23a5bf\"><\u002Fspan><span>03 — Principles<\u002Fspan><span aria-hidden=\"true\" style=\"flex: 1; height: 1px; background: rgba(30,30,36,0.24)\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px 64px; align-items: flex-end; justify-content: space-between\">\n<h2 id=\"mission-h\" style=\"margin: 0; flex: 1 1 480px; font-size: clamp(36px, 4.4vw, 56px); line-height: 1.08; font-weight: 500; letter-spacing: -1px; color: #000000\">AI should support you, not influence you.<\u002Fh2>\n<p style=\"margin: 0; flex: 0 1 460px; font-size: 18px; line-height: 1.7; color: #3a3a42\">Three commitments that keep us honest about what a conversational AI is, and what it isn't.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px\">\n<article class=\"ec-reveal\" style=\"display: flex; flex-direction: column; gap: 14px; padding-top: 24px; border-top: 2px solid #1e1e24\">\n<p style=\"margin: 0; font-family: 'Courier Prime', monospace; font-size: 14px; letter-spacing: 0.14em; color: #05425b\">01<\u002Fp>\n<h3 style=\"margin: 0; font-size: 26px; font-weight: 500; color: #000000\">Transparency<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.7; color: #3a3a42\">You deserve to know how your AI works. We communicate clearly about what the system does, how it uses data, and where its boundaries are.<\u002Fp>\n<\u002Farticle>\n<article class=\"ec-reveal\" style=\"display: flex; flex-direction: column; gap: 14px; padding-top: 24px; border-top: 2px solid #1e1e24\">\n<p style=\"margin: 0; font-family: 'Courier Prime', monospace; font-size: 14px; letter-spacing: 0.14em; color: #05425b\">02<\u002Fp>\n<h3 style=\"margin: 0; font-size: 26px; font-weight: 500; color: #000000\">Safety<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.7; color: #3a3a42\">Our systems minimize harm, avoid manipulative patterns, and are informed by behavioral science to protect users' emotional health.<\u002Fp>\n<\u002Farticle>\n<article class=\"ec-reveal\" style=\"display: flex; flex-direction: column; gap: 14px; padding-top: 24px; border-top: 2px solid #1e1e24\">\n<p style=\"margin: 0; font-family: 'Courier Prime', monospace; font-size: 14px; letter-spacing: 0.14em; color: #05425b\">03<\u002Fp>\n<h3 style=\"margin: 0; font-size: 26px; font-weight: 500; color: #000000\">User control<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.7; color: #3a3a42\">Your data, your choices. We give users control settings, clear consent, and technology that respects autonomy at every step.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"solutions\" aria-labelledby=\"solutions-h\" style=\"background: #fdfbf7\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px 160px; display: flex; flex-direction: column; gap: 56px\">\n<div style=\"display: flex; flex-direction: column; gap: 24px\">\n<div style=\"display: flex; align-items: center; gap: 16px; font-family: 'Courier Prime', monospace; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #1e1e24\"><span aria-hidden=\"true\" style=\"width: 8px; height: 8px; background: #23a5bf\"><\u002Fspan><span>04 — Solutions<\u002Fspan><span aria-hidden=\"true\" style=\"flex: 1; height: 1px; background: rgba(30,30,36,0.24)\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px 64px; align-items: flex-end; justify-content: space-between\">\n<h2 id=\"solutions-h\" style=\"margin: 0; flex: 1 1 480px; font-size: clamp(36px, 4.4vw, 56px); line-height: 1.08; font-weight: 500; letter-spacing: -1px; color: #000000\">Sixty years of lessons, built into today's tools.<\u002Fh2>\n<p style=\"margin: 0; flex: 0 1 460px; font-size: 18px; line-height: 1.7; color: #3a3a42\">Two products, one standard: support people well, and be honest about what the AI is.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px\">\n<article class=\"ec-reveal\" style=\"background: #0c0a16; border-radius: 20px; padding: 40px 40px 0; display: flex; flex-direction: c margin: 0; font-size: 15px; line-height: 1.45; color: #f9f9f9\">What's one thing you're carrying into today?<\u002Fp>\n<div style=\"display: flex; gap: 8px\"><span style=\"width: 26px; height: 26px; border-radius: 13px; background: #2e2a44\"><\u002Fspan><span style=\"width: 26px; height: 26px; border-radius: 13px; background: #2e2a44\"><\u002Fspan><span style=\"width: 26px; height: 26px; border-radius: 13px; background: #31bfbf\"><\u002Fspan><span style=\"width: 26px; height: 26px; border-radius: 13px; background: #2e2a44\"><\u002Fspan><span style=\"width: 26px; height: 26px; border-radius: 13px; background: #2e2a44\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-radius: 100px; background: #31bfbf; color: #0c0a16; text-align: center; padding: 12px; font-size: 15px; font-weight: 500\">Start reflection<\u002Fdiv>\n<div style=\"border-radius: 18px; background: #1f1c30; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center\"><span style=\"font-size: 14px; color: #f9f9f9\">Patterns this week<\u002Fspan><span style=\"display: flex; gap: 4px; align-items: flex-end\"><span style=\"width: 6px; height: 10px; border-radius: 3px; background: #c6b6f2\"><\u002Fspan><span style=\"width: 6px; height: 16px; border-radius: 3px; background: #c6b6f2\"><\u002Fspan><span style=\"width: 6px; height: 12px; border-radius: 3px; background: #c6b6f2\"><\u002Fspan><span style=\"width: 6px; height: 20px; border-radius: 3px; background: #31bfbf\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article class=\"ec-reveal\" style=\"background: #ffffff; border-radius: 20px; padding: 40px; display: flex; flex-direction: column; gap: 20px; border: 1px solid rgba(30,30,36,0.14)\">\n<p style=\"margin: 0; font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #05425b\">For schools · ElizaChat<\u002Fp>\n<h3 style=\"margin: 0; font-size: 32px; line-height: 1.15; font-w : column; gap: 6px; font-size: 15px\"><p style=\"margin: 0 0 8px; font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #3a3a42\">Products<\u002Fp><a href=\"#\" style=\"color: #1e1e24; text-decoration: none; padding: 6px 0\">NUE<\u002Fa><a href=\"#\" style=\"color: #1e1e24; text-decoration: none; padding: 6px 0\">ElizaChat for Schools<\u002Fa><a href=\"#insights\" style=\"color: #1e1e24; text-decoration: none; padding: 6px 0\">Insights<\u002Fa><\u002Fnav>\n<nav aria-label=\"Company\" style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15px\"><p style=\"margin: 0 0 8px; font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #3a3a42\">Company<\u002Fp><a href=\"#story\" style=\"color: #1e1e24; text-decoration: none; padding: 6px 0\">The Eliza story<\u002Fa><a href=\"#mission\" style=\"color: #1e1e24; text-decoration: none; padding: 6px 0\">Our mission<\u002Fa><a href=\"#\" style=\"color: #1e1e24; text-decoration: none; padding: 6px 0\">Clinical Advisory Board<\u002Fa><a href=\"#\" style=\"color: #1e1e24; text-decoration: none; padding: 6px 0\">Contact<\u002Fa><\u002Fnav>\n<nav aria-label=\"Trust and compliance\" style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15px\"><p style=\"margin: 0 0 8px; font-family: 'Courier Prime', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #3a3a42\">Trust &amp; compliance<\u002Fp><a href=\"#\" style=\"color: #1e1e24; text-decoration: none; padding: 6px 0\">Privacy policy<\u002Fa><a href=\"#\" style=\"color: #1e1e24; text-decoration: none; padding: 6px 0\">Terms of use<\u002Fa><a href=\"#\" style=\"color: #1e1e24; text-decoration: none; padding: 6px 0\">Accessibility<\u002Fa><a href=\"#\" style=\"color: #1e1e24; text-decoration: none; padding: 6px 0\">Safety &amp; crisis resources<\u002Fa><\u002Fnav>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-top: 24px; border-top: 1px solid rgba(30,30,36,0.14); font-family: 'Courier Prime', monospace; font-size: 13px; color: #3a3a42\"><span>© 2026 ElizaChat Inc.<\u002Fspan><span>NUE is not therapy. It complements care.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:10400}}\">\nvar EC_FULL = 'ELIZA is an early natural language processing computer program, developed from 1964 to 1967 at MIT by Joseph Weizenbaum.';\nvar EC_GREETING = { who: 'eliza', text: 'HOW DO YOU DO. PLEASE TELL ME YOUR PROBLEM.', trace: 'Opening line' };\nvar EC_STEPS = [\n  { year: '1923', title: 'Born in Berlin', body: \"Joseph Weizenbaum's family fled Nazi Germany for the United States in 1936. He went on to study mathematics and work in early commercial computing before joining MIT.\", kind: 'placeholder', label: '[PHOTO]\\nJoseph Weizenbaum, portrait\\nB&W · licensed image needed', caption: 'FIG. 02 — Joseph Weizenbaum (1923–2008).' },\n  { year: '1964', title: 'ELIZA takes shape at MIT', body: 'Weizenbaum writes ELIZA in MAD-SLIP, a list-processing language he built himself. It runs on an IBM 7094 under CTSS, one of the first time-sharing systems, where many people type at terminals connected to one computer.', kind: 'placeholder', label: '[PHOTO]\\nIBM 7094 with magnetic tape drives\\nB&W · licensed image needed', caption: 'FIG. 03 — The IBM 7094, the machine ELIZA first ran on.' },\n  { year: '1966', title: 'The paper, and the DOCTOR', body: 'In January, Communications of the ACM publishes his paper on ELIZA. Its best-known script, DOCTOR, plays a Rogerian therapist: it reflects your own words back to you as open questions.', kind: 'image', src: '/_blob/6c4758d845f9f0a47c8940988fb8daf0', alt: 'Vintage terminal showing an ELIZA conversation', caption: 'FIG. 04 — A DOCTOR-script exchange on a period terminal.' },\n  { year: '1966', title: '\"Please leave the room\"', body: \"Weizenbaum's own secretary asked him to step out so she could talk to ELIZA in private. He was startled that a short chat with such a simple program could convince ordinary people it understood them.\", kind: 'terminal', label: 'HOW DO YOU DO.\\nPLEASE TELL ME YOUR PROBLEM.\\n\\n> _', caption: 'FIG. 05 — Illustration: the prompt that drew people in.' },\n  { year: '1976', title: 'A warning in print', body: 'In Computer Power and Human Reason, Weizenbaum argues against reducing human thought to computation, and against handing machines the decisions that need human judgment and care.', kind: 'placeholder', label: '[PHOTO]\\nComputer Power and Human Reason\\nfirst edition, 1976', caption: 'FIG. 06 — The book that turned the creator into a critic.' },\n  { year: '2021', title: 'The original code resurfaces', body: \"Jeff Shrager and MIT archivist Myles Crowley find ELIZA's original source code in Weizenbaum's papers at MIT. His estate releases it into the public domain.\", kind: 'placeholder', label: '[PHOTO]\\nOriginal ELIZA printout\\nMIT archives', caption: 'FIG. 07 — Pages of MAD-SLIP, found in the archive.' },\n  { year: '2024', title: 'ELIZA talks again', body: 'A team of engineers and historians runs the recovered code on an emulated IBM 7094 and CTSS. It reproduces, almost exactly, the conversations printed in the 1966 paper.', kind: 'terminal', label: 'CTSS · IBM 7094 EMULATOR\\nLOADING ELIZA ...\\n\\nHOW DO YOU DO.\\nPLEASE TELL ME YOUR PROBLEM.', caption: 'FIG. 08 — Illustration: ELIZA on emulated 1960s hardware.' },\n  { year: 'Today', title: 'ElizaChat', body: 'Our name nods to ELIZA. So does our caution. We build conversational AI that is honest about what it is, and designed around what people actually need.', kind: 'logo', caption: 'FIG. 09 — ElizaChat, 2026.' }\n];\nvar EC_SWAP = { i: 'you', me: 'you', my: 'your', am: 'are', mine: 'yours', myself: 'yourself', you: 'I', your: 'my', yours: 'mine', \"i'm\": 'you are', \"i've\": 'you have' };\nfunction ecReflect(s) {\n  return s.toLowerCase().replace(/[.!?,]+$/g, '').split(/\\s+/).map(function (w) { return EC_SWAP[w] || w; }).join(' ').toUpperCase();\n}\nvar EC_RULES = [\n  { re: /\\bi(?: am|'m) (.+)/i, key: 'I AM', out: function (m) { return 'HOW LONG HAVE YOU BEEN ' + ecReflect(m[1]) + '?'; } },\n  { re: /\\bi feel (.+)/i, key: 'I FEEL', out: function (m) { return 'DO YOU OFTEN FEEL ' + ecReflect(m[1]) + '?'; } },\n  { re: /\\bi need (.+)/i, key: 'I NEED', out: function (m) { return 'WHAT WOULD IT MEAN TO YOU IF YOU GOT ' + ecReflect(m[1]) + '?'; } },\n  { re: /\\bmy (mother|father|mom|dad|family|sister|brother|wife|husband|partner|parents)\\b/i, key: 'MY + FAMILY', out: function () { return 'TELL ME MORE ABOUT YOUR FAMILY.'; } },\n  { re: /\\bbecause\\b/i, key: 'BECAUSE', out: function () { return 'IS THAT THE REAL REASON?'; } },\n  { re: /\\balways\\b/i, key: 'ALWAYS', out: function () { return 'CAN YOU THINK OF A SPECIFIC EXAMPLE?'; } },\n  { re: /^\\s*(yes|yeah|yep)\\b/i, key: 'YES', out: function () { return 'YOU SEEM QUITE POSITIVE.'; } },\n  { re: /^\\s*(no|nope)\\b/i, key: 'NO', out: function () { return 'ARE YOU SAYING NO JUST TO BE NEGATIVE?'; } },\n  { re: /\\byou\\b/i, key: 'YOU', out: function () { return 'WE WERE DISCUSSING YOU, NOT ME.'; } }\n];\nvar EC_STOCK = ['PLEASE GO ON.', 'CAN YOU ELABORATE ON THAT?', 'I SEE.', 'WHAT DOES THAT SUGGEST TO YOU?'];\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { typed: 0, draft: '', msgs: [EC_GREETING], stock: 0, active: 0 };\n    var self = this;\n    this.stepEls = [];\n    this.termRef = function (el) {\n      if (!el || self.io || typeof window === 'undefined' || !('IntersectionObserver' in window)) return;\n      self.io = new IntersectionObserver(function (entries) {\n        if (entries.some(function (e) { return e.isIntersecting; })) { self.startTyping(); self.io.disconnect(); }\n      }, { threshold: 0.3 });\n      self.io.observe(el);\n    };\n    this.stepRefs = EC_STEPS.map(function (_, i) {\n      return function (el) {\n        if (!el) return;\n        self.stepEls[i] = el;\n        if (typeof window === 'undefined' || !('IntersectionObserver' in window)) return;\n        if (!self.stepIO) {\n          self.stepIO = new IntersectionObserver(function (entries) {\n            entries.forEach(function (e) {\n              if (!e.isIntersecting) return;\n              var idx = self.stepEls.indexOf(e.target);\n              if (idx >= 0 && idx !== self.state.active) self.setState({ active: idx });\n            });\n          }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });\n        }\n        if (!el.__ecObserved) { el.__ecObserved = true; self.stepIO.observe(el); }\n      };\n    });\n  }\n  componentDidMount() {\n    var reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this.reduce = reduce;\n    if (reduce) { this.setState({ typed: EC_FULL.length }); return; }\n    if (typeof window === 'undefined' || !('IntersectionObserver' in window)) this.startTyping();\n  }\n  componentWillUnmount() {\n    if (this.timer) clearInterval(this.timer);\n    if (this.io) this.io.disconnect();\n    if (this.stepIO) this.stepIO.disconnect();\n  }\n  startTyping() {\n    if (this.timer) return;\n    var self = this;\n    this.timer = setInterval(function () {\n      var n = (self.state.typed || 0) + 1;\n      if (n >= EC_FULL.length) { clearInterval(self.timer); n = EC_FULL.length; }\n      self.setState({ typed: n });\n    }, 34);\n  }\n  send(text) {\n    var t = (text || '').trim();\n    if (!t) return;\n    var reply = null;\n    for (var i = 0; i < EC_RULES.length; i++) {\n      var m = t.match(EC_RULES[i].re);\n      if (m) { reply = { text: EC_RULES[i].out(m), trace: 'Keyword \"' + EC_RULES[i].key + '\" found, your words reassembled' }; break; }\n    }\n    var stock = this.state.stock || 0;\n    if (!reply) { reply = { text: EC_STOCK[stock % EC_STOCK.length], trace: 'No keyword found, stock reply' }; stock++; }\n    var msgs = (this.state.msgs || []).concat([{ who: 'user', text: t }, { who: 'eliza', text: reply.text, trace: reply.trace }]).slice(-10);\n    this.setState({ msgs: msgs, draft: '', stock: stock });\n  }\n  renderVals() {\n    var self = this;\n    var s = this.state || {};\n    var active = s.active || 0;\n    var cur = EC_STEPS[active];\n    var chipTexts = ['I am unhappy', 'I need some help', 'My mother takes care of me'];\n    return {\n      termRef: this.termRef,\n      fullText: EC_FULL,\n      typedText: EC_FULL.slice(0, s.typed || 0),\n      activeYear: cur.year,\n      activeCaption: cur.caption,\n      activeNum: '0' + (active + 1) + ' / 0' + EC_STEPS.length,\n      steps: EC_STEPS.map(function (st, i) {\n        return {\n          year: st.year, title: st.title, body: st.body, label: st.label || '', src: st.src || '', alt: st.alt || '',\n          isImage: st.kind === 'image', isPlaceholder: st.kind === 'placeholder', isTerminal: st.kind === 'terminal', isLogo: st.kind === 'logo',\n          ref: self.stepRefs[i],\n          state: i < active ? 'past' : (i === active ? 'active' : 'future'),\n          on: i === active ? 'true' : 'false',\n          hidden: i === active ? 'false' : 'true',\n          dotOn: i <= active ? 'true' : 'false',\n          go: function () {\n            var el = self.stepEls[i];\n            if (el && el.scrollIntoView) el.scrollIntoView({ behavior: self.reduce ? 'auto' : 'smooth', block: 'center' });\n            self.setState({ active: i });\n          }\n        };\n      }),\n      draft: s.draft || '',\n      msgs: (s.msgs || []).map(function (m) { return { text: m.text, trace: m.trace || '', isEliza: m.who === 'eliza', isUser: m.who === 'user' }; }),\n      chips: chipTexts.map(function (c) { return { label: c, send: function () { self.send(c); } }; }),\n      onDraft: function (e) { self.setState({ draft: e.target.value }); },\n      onKey: function (e) { if (e.key === 'Enter') { e.preventDefault(); self.send(self.state.draft); } },\n      sendDraft: function () { self.send(self.state.draft); },\n      reset: function () { self.setState({ msgs: [EC_GREETING], draft: '', stock: 0 }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
